name: CI Pipeline

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.18"

      - name: Start supporting services
        run: docker compose down -v --remove-orphans

      - name: Start database and mailcatcher
        run: docker compose up -d db mailcatcher

      - name: Install backend dependencies
        run: uv sync
        working-directory: backend

      - name: Run database migrations
        run: uv run bash scripts/prestart.sh
        working-directory: backend

      - name: Run backend tests
        run: uv run bash scripts/tests-start.sh "Coverage for ${{ github.sha }}"
        working-directory: backend

      - name: Check coverage threshold
        run: uv run coverage report --fail-under=90
        working-directory: backend

      - name: Upload coverage HTML
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-html
          path: backend/htmlcov
          include-hidden-files: true
          retention-days: 30

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-report
          path: backend/.coverage
          retention-days: 30

      - name: Cleanup services
        if: always()
        run: docker compose down -v --remove-orphans

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.18"

      - name: Install backend dependencies
        run: uv sync
        working-directory: backend

      - name: Install frontend dependencies
        run: bun ci
        working-directory: frontend

      - name: Generate API client
        run: bash scripts/generate-client.sh

      - name: Build Docker Compose stack
        run: docker compose build

      - name: Start services
        run: docker compose down -v --remove-orphans

      - name: Run database migrations
        run: docker compose run --rm backend bash scripts/prestart.sh

      - name: Start backend for testing
        run: docker compose up -d --wait backend mailcatcher

      - name: Run Playwright tests
        run: docker compose run --rm playwright bunx playwright test --fail-on-flaky-tests --trace=retain-on-failure

      - name: Upload Playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report
          include-hidden-files: true
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-test-results
          path: frontend/test-results
          include-hidden-files: true
          retention-days: 30

      - name: Cleanup services
        if: always()
        run: docker compose down -v --remove-orphans

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend-tests, frontend-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f7ce87ae1bee4255aab9d4e1c9a6f084934b57f0 # v3.9.0

      - name: Build Docker image
        run: docker compose build

      - name: Test Docker Compose stack
        run: docker compose down -v --remove-orphans

      - name: Run database migrations in container
        run: docker compose run --rm backend bash scripts/prestart.sh

      - name: Start services
        run: docker compose up -d --wait backend adminer

      - name: Test backend health check
        run: curl -f http://localhost:8000/api/v1/utils/health-check

      - name: Test frontend is served
        run: curl -f http://localhost:8000

      - name: Cleanup services
        if: always()
        run: docker compose down -v --remove-orphans

  linting:
    name: Code Linting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.18"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12

      - name: Install backend dependencies
        run: uv sync
        working-directory: backend

      - name: Install frontend dependencies
        run: bun install
        working-directory: frontend

      - name: Run Ruff check
        run: uv run ruff check --force-exclude
        working-directory: backend

      - name: Run Ruff format check
        run: uv run ruff format --force-exclude --check
        working-directory: backend

      - name: Run mypy
        run: uv run mypy backend/app
        working-directory: backend

      - name: Run ty check
        run: uv run ty check backend/app
        working-directory: backend

      - name: Run Biome check
        run: bun run lint
        working-directory: frontend

      - name: Upload linting results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: linting-results
          path: |
            backend/.ruff-cache/
            frontend/.biome-cache/
          retention-days: 7
